name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Main Stats Card (With private & lifetime commits enabled)
      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&bg_color=0d0e15&title_color=ff0055&text_color=00f0ff&icon_color=ff0055&border_color=00f0ff'
          path: profile/stats.svg
          token: ${{ secrets.MY_CUSTOM_PAT }}

      # 2. Top Languages Card (Upgraded to a sleek Donut chart)
      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=donut&langs_count=6&bg_color=0d0e15&title_color=ff0055&text_color=00f0ff&icon_color=ff0055&border_color=00f0ff'
          path: profile/top-langs.svg
          token: ${{ secrets.MY_CUSTOM_PAT }}

      # 3. Featured Repository Pin Card (Make sure to change the repo name below!)
      - name: Generate pin card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: 'username=${{ github.repository_owner }}&repo=YOUR_FAVORITE_REPO&bg_color=0d0e15&title_color=ff0055&text_color=00f0ff&icon_color=ff0055&border_color=00f0ff'
          path: profile/pin-featured.svg
          token: ${{ secrets.MY_CUSTOM_PAT }}

      # 4. Commit and push back to your profile repo
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards [Cyberpunk Theme]" || exit 0
          git push
